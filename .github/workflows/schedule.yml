name: attendance

on:
  schedule:
    # 北京 07:00 主跑，15:00 补跑（UTC 07:00）。GitHub cron 用 UTC。
    # 原为 UTC 16:00（北京 00:00），2026-09-27 统一到 07:00。
    #
    # 2026-11-11 加第二槽：本 workflow 是全账户延迟最严重的一个 —— 100 条运行
    # 中位延迟 17.2 小时、最长 22 小时，且 8-27 / 9-27 各整条丢过一次。
    # 稳定 17 小时的漂移不可能靠调时刻抵消，只能靠「多一次机会」。
    - cron: '0 23 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  # 本 workflow 只读（不提交、不写 issue）
  contents: read
  # gate job 要读本 workflow 当天的运行记录
  actions: read

jobs:
  # 补跑槽的守卫：今天已有成功运行就跳过。独立成 job 是为了不动下面任何一步。
  # 查询失败一律按「今天没跑过」处理：宁可多跑一趟，不能漏签。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.q.outputs.skip }}
    steps:
      - name: 查当天是否已有成功运行
        id: q
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          now=$(date -u +%s)
          # 北京当天 00:00 对应的 UTC 时刻（纯算术，不吃时区数据库）
          day_start=$(( (now + 28800) / 86400 * 86400 - 28800 ))
          since=$(date -u -d "@$day_start" +%Y-%m-%dT%H:%M:%SZ)
          wf="${GITHUB_WORKFLOW_REF%@*}"
          wf="${wf##*/.github/workflows/}"
          n=$(curl -sS --max-time 15 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?per_page=50&created=%3E%3D${since}&status=success" \
              | jq --arg me "${GITHUB_RUN_ID}" '[.workflow_runs[]? | select((.id|tostring) != $me)] | length' 2>/dev/null) || n=""
          case "${n:-}" in ''|*[!0-9]*) echo "查询失败，按「今天没跑过」处理"; n=0 ;; esac
          echo "北京当天起点 ${since}；今天已成功 ${n} 次"
          if [ "$n" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi

  attendance:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != '1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      # 跨运行保留凭证状态文件，用于在推送里标明 Token 认证日期。
      # key 带 run_id 保证每次都写入，restore-keys 前缀匹配拿回上一次的。
      # 注意 path 与 SKLAND_STATE_FILE 必须指向同一个文件：pnpm -C 会切换工作目录，
      # 用相对路径会写到 apps/node/ 下，导致这里匹配不到、缓存永远存不上。
      - name: Restore credential state
        uses: actions/cache@v4
        with:
          path: .skland-state.json
          key: skland-state-${{ github.run_id }}
          restore-keys: |
            skland-state-

      - name: Run daily attendance
        run: pnpm -C "./apps/node" start
        env:
          SKLAND_TOKEN: ${{ secrets.SKLAND_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          MESSAGE_PUSHER_URL: ${{ secrets.MESSAGE_PUSHER_URL }}
          # 绝对路径，保证与上面的 cache path 指向同一文件（pnpm -C 会切工作目录）
          SKLAND_STATE_FILE: ${{ github.workspace }}/.skland-state.json
